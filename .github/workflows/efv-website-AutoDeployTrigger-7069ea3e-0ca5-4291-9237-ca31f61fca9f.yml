name: Trigger auto deployment for efv-website

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/efv-website-AutoDeployTrigger-7069ea3e-0ca5-4291-9237-ca31f61fca9f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EFVWEBSITE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EFVWEBSITE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EFVWEBSITE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: efvacrstore.azurecr.io
          registryUsername: ${{ secrets.EFVWEBSITE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EFVWEBSITE_REGISTRY_PASSWORD }}
          containerAppName: efv-website
          resourceGroup: efv-rg
          imageToBuild: efvacrstore.azurecr.io/efv-website:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


